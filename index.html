<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    height: 100vh;
    background: url('https://images.unsplash.com/photo-1503264116251-35a269479413') no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
}

.container {
    width: 90%;
    max-width: 900px;
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    text-align: center;
}

/* LOGO STYLE */
.logo {
    width: 180px;
    margin-bottom: 20px;
    transition: 0.4s;
}

.logo:hover {
    transform: scale(1.08);
}

/* CARD */
.card {
    margin: 15px 0;
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.card h2 {
    color: white;
    font-size: 18px;
}

.btn {
    padding: 10px 20px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    color: white;
    font-weight: bold;
    background: linear-gradient(45deg, #4facfe, #00f2fe);
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0,255,255,0.6);
}

img {
    pointer-events: none;
}
</style>

</head>

<body oncontextmenu="return false;">

<div class="container">

    <!-- LOGO INSTEAD OF TITLE -->
    <img src="logo.png" alt="Company Logo" class="logo">

    <div class="card">
        <h2>Hyderabad(HYDS) Moglix Operations 2026</h2>
        <button class="btn" onclick="openLink('https://docs.google.com/spreadsheets/d/1EXdibIOuv_evcnTuDeJlLbnLoYR23MwMuyZ7rD_9_Aw/edit?usp=sharing')">Visit</button>
    </div>

    <div class="card">
        <h2>HYDS INBOND & OUTBOND March-26</h2>
        <button class="btn" onclick="openLink('https://moglix-my.sharepoint.com/:x:/r/personal/murali_mala_moglix_com/Documents/HYDS%20INBOND%20%26%20OUTBOND%20March-26.xlsx')">Visit</button>
    </div>

    <div class="card">
        <h2>IRT April 2026</h2>
        <button class="btn" onclick="openLink('https://moglix-my.sharepoint.com')">Visit</button>
    </div>

    <div class="card">
        <h2>HYDS Standard Form</h2>
        <button class="btn" onclick="openLink('https://docs.google.com')">Visit</button>
    </div>

    <div class="card">
        <h2>Log10 Valmo</h2>
        <button class="btn" onclick="openLink('https://console.valmo.in/operations/login')">Visit</button>
    </div>

</div>

<script>
function openLink(url) {
    window.open(url, "_blank");
}

</script>

</body>
</html>
