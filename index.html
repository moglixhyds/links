<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker Dashboard</title>

<style>

/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

/* Body */
body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
}

/* Background Video */
#bg-video {
    position: fixed;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    object-fit: cover;
    z-index: -1;
}

/* Dark Overlay */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.35);
    z-index: -1;
}

/* Glass Container */
.container {
    width: 90%;
    max-width: 900px;
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    text-align: center;
}

/* Title */
h1 {
    color: red;
    margin-bottom: 25px;
    letter-spacing: 1px;
}

/* Card */
.card {
    margin: 15px 0;
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Text */
.card h2 {
    color: white;
    font-size: 18px;
}

/* Button */
.btn {
    padding: 10px 20px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    color: white;
    font-weight: bold;
    background: linear-gradient(45deg, #4facfe, #00f2fe);
    transition: 0.3s;
}

/* Button Hover */
.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0,255,255,0.6);
}

/* Disable drag */
img {
    pointer-events: none;
}

/* Mobile Responsive */
@media (max-width: 768px) {
    .card {
        flex-direction: column;
        gap: 15px;
    }

    .card h2 {
        font-size: 16px;
        text-align: center;
    }
}



/* Left Side Digital Clock */
.datetime-box {
    position: fixed;
    left: -290px;
    top: 50%;
    transform: translateY(-50%);
    width: 220px;
    padding: 15px;
    border-radius: 16px;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(10px);
    color: #00ffcc;
    box-shadow: 0 0 20px rgba(0,255,255,0.3);
    z-index: 9999;
    text-align: center;
}

#digital-clock {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
}

#digital-date {
    margin-top: 10px;
    font-size: 15px;
    color: white;
    line-height: 1.5;
}


</style>
</head>

<script>

function updateDateTime() {
    const now = new Date();

    const time = now.toLocaleTimeString('en-IN', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
    });

    const date = now.toLocaleDateString('en-IN', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });

    document.getElementById("digital-clock").innerText = time;
    document.getElementById("digital-date").innerText = date;
}

setInterval(updateDateTime, 1000);
updateDateTime();



function openLink(url) {
    window.open(url, "_blank");
}

/* Disable keyboard shortcuts */
document.addEventListener("keydown", function(e) {
    if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's')) {
        e.preventDefault();
    }
});

</script>
